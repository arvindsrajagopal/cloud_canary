# Local monitoring stack for cloud_canary.
#
# Usage:
#   cd monitoring/
#   docker compose up -d
#
# Prometheus: http://localhost:9090
# Grafana:    http://localhost:3000  (admin / admin)
#
# The canary must be running on the host with metrics exposed on port 8000.
# Prometheus reaches it via host.docker.internal (works on macOS natively;
# extra_hosts below adds the same alias on Linux).

services:
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: canary-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux compat; no-op on macOS

  grafana:
    image: grafana/grafana:10.4.2
    container_name: canary-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cloud_canary.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
